name: Publish to PyPI

# Publishes the sdist + wheel to PyPI when a version tag is pushed -- the same
# v<version> tag that triggers the AppImage release (see release.yml), so one
# `git push origin vX.Y.Z` cuts both the GitHub Release and the PyPI release.
#
# Authentication uses PyPI Trusted Publishing (OIDC): no API token or secret is
# stored in the repo. One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Owner: rmoskwa   Repository: auto-DTI-ALPS
#   Workflow: publish.yml   Environment: pypi
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the Trusted Publisher configured on PyPI.
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
