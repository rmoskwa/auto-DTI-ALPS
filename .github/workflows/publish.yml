name: Publish to PyPI

# Publishes the sdist + wheel to PyPI when a version tag is pushed -- the same
# v<version> tag that triggers the AppImage release (see release.yml), so one
# `git push origin vX.Y.Z` cuts both the GitHub Release and the PyPI release.
#
# Authentication uses PyPI Trusted Publishing (OIDC): no API token or secret is
# stored in the repo. One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Owner: rmoskwa   Repository: auto-DTI-ALPS
#   Workflow: publish.yml   Environment: pypi
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The JHU ROI templates (dti_alps/templates/*.nii.gz) are tracked in
          # git-LFS. Without this, checkout leaves ~130-byte LFS pointer stubs
          # in their place and `python -m build` ships those stubs in the wheel.
          # pipx then installs a package whose templates are truncated text
          # files, and FSL fails at ROI placement with "short read, file may be
          # truncated". Pull the real binaries so the wheel contains real data.
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Guard against a tag/version mismatch: the build takes its version from
      # pyproject.toml, not the tag, so tagging v0.1.2 without bumping the
      # version silently rebuilds the old release and PyPI rejects it with a
      # confusing "file already exists". Fail early with an actionable message.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject version '${version}'. Bump the version first (e.g. scripts/bump-version.sh) so the tag and package agree."
            exit 1
          fi
          echo "Tag and package version agree: ${version}"

      # Guard against shipping git-LFS pointer stubs instead of the real ROI
      # templates. `twine check` only validates metadata, so a wheel full of
      # 130-byte pointer files passes it and breaks ROI placement at runtime.
      # Every template must be a real gzip stream, not an LFS pointer.
      - name: Verify ROI templates are real files, not LFS pointers
        run: |
          fail=0
          for f in dti_alps/templates/*.nii.gz; do
            if head -c 64 "$f" | grep -q "git-lfs.github.com/spec"; then
              echo "::error::$f is a git-LFS pointer stub, not the real template. Checkout must use lfs: true."
              fail=1
            elif [ "$(head -c 2 "$f" | xxd -p)" != "1f8b" ]; then
              echo "::error::$f is not a gzip file (missing 1f8b magic). Template may be corrupt or truncated."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "All ROI templates are real gzip files."
          exit "$fail"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the Trusted Publisher configured on PyPI.
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
