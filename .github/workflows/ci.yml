name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev + gui extras
        run: pip install -e ".[dev,gui]"
      # test_pipeline.py and test_registration.py are real-binary integration
      # smoke tests that shell out to MRtrix3/FSL (see pyproject per-file-ignores).
      # Those toolchains aren't on the runner, so they're excluded here.
      - name: Run tests
        run: |
          pytest tests/ \
            --ignore=tests/test_pipeline.py \
            --ignore=tests/test_registration.py
