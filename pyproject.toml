[project]
name = "dti-alps"
version = "0.1.0"
description = "Automatic DTI-ALPS ROI detection and analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "DTI-ALPS Team"}
]
keywords = ["dti", "alps", "neuroimaging", "mri", "diffusion"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy",
    "nibabel",
    "scipy",
]

[project.optional-dependencies]
gui = [
    "matplotlib",
    "Pillow",
    "PySide6",
]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ruff",
]

[project.scripts]
dti-alps = "dti_alps.__main__:main"

[project.urls]
Repository = "https://github.com/rmoskwa/auto-DTI-ALPS"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dti_alps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "TID251", # flake8-tidy-imports banned-api (the ToolRunner seam guardrail)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict= (requires 3.10+)
]

[tool.ruff.lint.isort]
known-first-party = ["dti_alps"]

# The ToolRunner seam: every external toolchain command must flow
# through ToolRunner. Importing subprocess anywhere else silently bypasses the
# seam, so it is banned outside the carve-outs in per-file-ignores below.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Route external commands through processing.tool_runner.ToolRunner instead of importing subprocess."

[tool.ruff.lint.per-file-ignores]
# The seam itself -- the one place subprocess is allowed.
"dti_alps/processing/tool_runner.py" = ["TID251"]
# GUI desktop-open (open/xdg-open/explorer): fire-and-forget, cross-platform,
# no toolchain dependency -- deliberately outside the seam.
"dti_alps/gui/app.py" = ["TID251"]
# Real-binary integration smoke tests: they shell out to
# actual MRtrix3/FSL on a machine that has them.
"tests/test_pipeline.py" = ["TID251"]
"tests/test_registration.py" = ["TID251"]
# Engine import-guard: spawns a fresh Python interpreter to get a
# clean sys.modules, not a toolchain command -- legitimately outside the seam.
"tests/test_engine_independence.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
